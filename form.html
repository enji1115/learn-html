<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form요소</title>
  </head>
  <body>
    <h2>Form 요소 살펴보기</h2>

    <!-- 로그인 박스 -->
    <form>
      <h5>로그인 해주세요</h5>
      <div>
        ID:
        <input
          type="text"
          name="userID"
          id=""
          placeholder="아이디를 입력해 주세요"
          required
        />
      </div>
      <div>
        Password:
        <input
          type="password"
          name="userPassword"
          id=""
          placeholder="비밀번호를 입력해 주세요"
          required
        />
      </div>
      <input type="submit" value="로그인" />
      <!-- // 아래거는 나중에 -->
      <!-- <button type="submit">로그인</button> -->
    </form>
  </body>
</html>
